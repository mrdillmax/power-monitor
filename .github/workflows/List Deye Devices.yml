name: List Deye Devices
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: List Devices
        run: |
          TOKEN="${{ secrets.DEYE_TOKEN }}"
          URL="${{ secrets.DEYE_URL || 'https://eu1-developer.deyecloud.com/v1.0' }}"

          echo "=== List devices ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
               -H "User-Agent: GitHubActions/1.0" \
               -H "Accept: application/json" \
               "$URL/device/v1.0/devices" \
               | jq '.dataList | map(select(.deviceSn == "${{ secrets.DEYE_DEVICE_SN }}") | .[])'

          echo ""
          echo "=== Try with deviceId instead of SN ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
               -H "User-Agent: GitHubActions/1.0" \
               -H "Accept: application/json" \
               "$URL/device/v1.0/currentData?deviceId=${{ secrets.DEYE_DEVICE_ID || '0' }}" \
               | jq '.dataList | length'
