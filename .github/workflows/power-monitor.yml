name: Power Monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Check Grid via Deye Cloud
        id: grid
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.DEYE_TOKEN }}" \
            "${{ secrets.DEYE_URL || 'https://eu1-developer.deyecloud.com/v1.0' }}/device/v1.0/currentData?deviceSn=${{ secrets.DEYE_DEVICE_SN }}")
          VOLTAGE=$(echo "$RESPONSE" | jq -r '.dataList[] | select(.value | tonumber | . > 1000 and . < 3000) | .value' | head -1)
          FREQUENCY=$(echo "$RESPONSE" | jq -r '.dataList[] | select(.value | tonumber | . > 4000 and . < 6000) | .value' | head -1)
          echo "voltage=$VOLTAGE" >> $GITHUB_OUTPUT
          echo "frequency=$FREQUENCY" >> $GITHUB_OUTPUT
      - name: Turn Off Socket (if grid lost)
        if: steps.grid.outputs.voltage == '' || steps.grid.outputs.frequency == ''
        run: |
          npx tuya-cli set --device-id "${{ secrets.TUYA_DEVICE_ID }}" \
            --access-id "${{ secrets.TUYA_ACCESS_ID }}" \
            --access-secret "${{ secrets.TUYA_ACCESS_SECRET }}" \
            --off
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] Grid lost – socket OFF" >> $GITHUB_WORKSPACE/power_monitor.log
      - name: Log Status
        run: |
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] Grid OK (V:${{ steps.grid.outputs.voltage }}V, F:${{ steps.grid.outputs.frequency }}Hz)" >> $GITHUB_WORKSPACE/power_monitor.log
          echo "Action taken: ${{ env.GRID_LOSS && 'Turned OFF' || 'None' }}" >> $GITHUB_WORKSPACE/power_monitor.log
      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power-monitor-logs
          path: power_monitor.log
