name: Power Monitor

on:
  # Основний тригер — зовнішній cron-job.org через API dispatch.
  # Вбудований schedule залишено як резерв (може затримуватись).
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_action:
        description: 'Примусово: on / off / none (для тестів)'
        required: false
        default: 'none'

concurrency:
  group: power-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet tinytuya

      - name: Run monitor
        env:
          DEYE_TOKEN: ${{ secrets.DEYE_TOKEN }}
          DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
          DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
          DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
          DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          DEYE_SN: ${{ secrets.DEYE_DEVICE_SN }}
          DEYE_BASE: ${{ secrets.DEYE_URL || 'https://eu1-developer.deyecloud.com/v1.0' }}
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          TUYA_REGION: ${{ secrets.TUYA_REGION || 'eu' }}
          FORCE_ACTION: ${{ github.event.inputs.force_action || 'none' }}
        run: |
          set -o pipefail
          python -u monitor.py 2>&1 | tee power_monitor.log

      - name: Save log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-monitor-log
          path: power_monitor.log
          if-no-files-found: ignore
